apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-service
  labels:
    app: route-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: route-service
  template:
    metadata:
      labels:
        app: route-service
        version: v1
    spec:
      containers:
      - name: route-service
        image: route-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
          name: http
        - containerPort: 9093
          name: grpc
        env:
        - name: HTTP_PORT
          value: "8083"
        - name: GRPC_PORT
          value: "9093"
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: route-service
  labels:
    app: route-service
spec:
  type: ClusterIP
  ports:
  - port: 8083
    targetPort: 8083
    protocol: TCP
    name: http
  - port: 9093
    targetPort: 9093
    protocol: TCP
    name: grpc
  selector:
    app: route-service
