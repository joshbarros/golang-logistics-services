---
# PostgreSQL Database Secrets
#
# IMPORTANT: This file contains base64-encoded secrets.
# In production, use a secrets management solution like:
# - HashiCorp Vault
# - AWS Secrets Manager
# - Google Secret Manager
# - Azure Key Vault
# - Sealed Secrets (bitnami-labs/sealed-secrets)
#
# To encode secrets:
# echo -n 'your-password' | base64
#
# To create this secret from command line instead:
# kubectl create secret generic postgres-secret \
#   --from-literal=username=postgres \
#   --from-literal=password=your-secure-password

apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: default
type: Opaque
data:
  # Default values for development (NOT for production!)
  # username: postgres (base64)
  username: cG9zdGdyZXM=
  # password: postgres (base64) - CHANGE THIS IN PRODUCTION!
  password: cG9zdGdyZXM=

---
# Order Service Database Secret
apiVersion: v1
kind: Secret
metadata:
  name: order-db-secret
  namespace: default
type: Opaque
data:
  db-name: b3JkZXJfZGI=  # order_db
  db-host: cG9zdGdyZXMtb3JkZXI=  # postgres-order
  db-port: NTQzMg==  # 5432

---
# Shipment Service Database Secret
apiVersion: v1
kind: Secret
metadata:
  name: shipment-db-secret
  namespace: default
type: Opaque
data:
  db-name: c2hpcG1lbnRfZGI=  # shipment_db
  db-host: cG9zdGdyZXMtc2hpcG1lbnQ=  # postgres-shipment
  db-port: NTQzMg==  # 5432

---
# Inventory Service Database Secret
apiVersion: v1
kind: Secret
metadata:
  name: inventory-db-secret
  namespace: default
type: Opaque
data:
  db-name: aW52ZW50b3J5X2Ri  # inventory_db
  db-host: cG9zdGdyZXMtaW52ZW50b3J5  # postgres-inventory
  db-port: NTQzMg==  # 5432

---
# Driver Service Database Secret
apiVersion: v1
kind: Secret
metadata:
  name: driver-db-secret
  namespace: default
type: Opaque
data:
  db-name: ZHJpdmVyX2Ri  # driver_db
  db-host: cG9zdGdyZXMtZHJpdmVy  # postgres-driver
  db-port: NTQzMw==  # 5433

---
# Route Service Database Secret
apiVersion: v1
kind: Secret
metadata:
  name: route-db-secret
  namespace: default
type: Opaque
data:
  db-name: cm91dGVfZGI=  # route_db
  db-host: cG9zdGdyZXMtcm91dGU=  # postgres-route
  db-port: NTQzNA==  # 5434

---
# Notification Service Database Secret
apiVersion: v1
kind: Secret
metadata:
  name: notification-db-secret
  namespace: default
type: Opaque
data:
  db-name: bm90aWZpY2F0aW9uX2Ri  # notification_db
  db-host: cG9zdGdyZXMtbm90aWZpY2F0aW9u  # postgres-notification
  db-port: NTQzMg==  # 5432

---
# JWT Secret for Authentication
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: default
type: Opaque
data:
  # jwt-secret-key: CHANGE THIS IN PRODUCTION!
  # Generate with: openssl rand -base64 32
  jwt-secret-key: Y2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbi1wbGVhc2U=

---
# API Keys for External Services
apiVersion: v1
kind: Secret
metadata:
  name: external-api-secrets
  namespace: default
type: Opaque
data:
  # Email service API key (e.g., SendGrid)
  # email-api-key: your-sendgrid-api-key-base64
  email-api-key: ""

  # SMS service API key (e.g., Twilio)
  # sms-api-key: your-twilio-api-key-base64
  sms-api-key: ""

  # Push notification key (e.g., Firebase)
  # push-api-key: your-firebase-key-base64
  push-api-key: ""
