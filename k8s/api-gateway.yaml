apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        version: v1
    spec:
      containers:
      - name: api-gateway
        image: api-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: HTTP_PORT
          value: "8000"
        - name: ORDER_SERVICE_URL
          value: "http://order-service:8080"
        - name: SHIPMENT_SERVICE_URL
          value: "http://shipment-service:8081"
        - name: INVENTORY_SERVICE_URL
          value: "http://inventory-service:8082"
        - name: ROUTE_SERVICE_URL
          value: "http://route-service:8083"
        - name: DRIVER_SERVICE_URL
          value: "http://driver-service:8084"
        - name: NOTIFICATION_SERVICE_URL
          value: "http://notification-service:8085"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: api-gateway
