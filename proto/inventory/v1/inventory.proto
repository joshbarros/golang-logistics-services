syntax = "proto3";

package inventory.v1;

option go_package = "github.com/joshbarros/golang-logistics-services/proto/inventory/v1;inventoryv1";

import "google/protobuf/timestamp.proto";

// Inventory Service - handles warehouse and stock management
service InventoryService {
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse);
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
  rpc UpdateStock(UpdateStockRequest) returns (UpdateStockResponse);
  rpc CheckAvailability(CheckAvailabilityRequest) returns (CheckAvailabilityResponse);
  rpc GetLowStockItems(GetLowStockItemsRequest) returns (GetLowStockItemsResponse);
}

message StockMovement {
  string id = 1;
  string item_id = 2;
  string movement_type = 3;
  int32 quantity = 4;
  int32 previous_quantity = 5;
  int32 new_quantity = 6;
  string reference = 7;
  string notes = 8;
  google.protobuf.Timestamp created_at = 9;
}

message InventoryItem {
  string id = 1;
  string product_id = 2;
  string name = 3;
  string sku = 4;
  string warehouse_location = 5;
  int32 quantity = 6;
  int32 reserved_quantity = 7;
  int32 reorder_level = 8;
  string status = 9;
  google.protobuf.Timestamp last_restocked = 10;
  repeated StockMovement movements = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message CreateItemRequest {
  string product_id = 1;
  string name = 2;
  string sku = 3;
  string warehouse_location = 4;
  int32 quantity = 5;
  int32 reorder_level = 6;
}

message CreateItemResponse {
  InventoryItem item = 1;
}

message GetItemRequest {
  string id = 1;
}

message GetItemResponse {
  InventoryItem item = 1;
}

message ListItemsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string status = 3;
}

message ListItemsResponse {
  repeated InventoryItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message UpdateStockRequest {
  string product_id = 1;
  int32 quantity = 2;
  string movement_type = 3;
  string reference = 4;
  string notes = 5;
}

message UpdateStockResponse {
  InventoryItem item = 1;
}

message CheckAvailabilityRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message CheckAvailabilityResponse {
  bool available = 1;
  int32 available_quantity = 2;
  string status = 3;
}

message GetLowStockItemsRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message GetLowStockItemsResponse {
  repeated InventoryItem items = 1;
  int32 total = 2;
}
