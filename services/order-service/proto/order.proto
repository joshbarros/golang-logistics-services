syntax = "proto3";

package order;

option go_package = "github.com/joshbarros/golang-logistics-services/services/order-service/proto";

import "proto/common/common.proto";

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse);
  rpc GetOrder(GetOrderRequest) returns (OrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc UpdateOrder(UpdateOrderRequest) returns (OrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (OrderResponse);
  rpc ValidateOrder(ValidateOrderRequest) returns (ValidateOrderResponse);
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_CONFIRMED = 2;
  ORDER_STATUS_PROCESSING = 3;
  ORDER_STATUS_SHIPPED = 4;
  ORDER_STATUS_DELIVERED = 5;
  ORDER_STATUS_CANCELLED = 6;
}

message Order {
  string id = 1;
  string customer_id = 2;
  string customer_name = 3;
  string customer_email = 4;
  common.Address shipping_address = 5;
  common.Address billing_address = 6;
  repeated OrderItem items = 7;
  double total_amount = 8;
  OrderStatus status = 9;
  string tracking_number = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
}

message OrderItem {
  string id = 1;
  string product_id = 2;
  string product_name = 3;
  int32 quantity = 4;
  double unit_price = 5;
  double total_price = 6;
}

message CreateOrderRequest {
  string customer_id = 1;
  string customer_name = 2;
  string customer_email = 3;
  common.Address shipping_address = 4;
  common.Address billing_address = 5;
  repeated OrderItem items = 6;
}

message GetOrderRequest {
  string id = 1;
}

message ListOrdersRequest {
  int32 page = 1;
  int32 page_size = 2;
  string customer_id = 3;
  OrderStatus status = 4;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message UpdateOrderRequest {
  string id = 1;
  OrderStatus status = 2;
  common.Address shipping_address = 3;
}

message CancelOrderRequest {
  string id = 1;
  string reason = 2;
}

message OrderResponse {
  Order order = 1;
  string message = 2;
}

message ValidateOrderRequest {
  string order_id = 1;
}

message ValidateOrderResponse {
  bool valid = 1;
  string message = 2;
}
